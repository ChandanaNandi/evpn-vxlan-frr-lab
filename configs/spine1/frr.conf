frr defaults datacenter
hostname spine1
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.3/32
!
router bgp 65000
 bgp router-id 10.0.0.3
 no bgp default ipv4-unicast
 neighbor 10.0.12.2 remote-as 65001
 neighbor 10.0.12.2 timers 3 9
 neighbor 10.0.23.3 remote-as 65002
 neighbor 10.0.23.3 timers 3 9
 !
 address-family ipv4 unicast
  network 10.0.0.3/32
  neighbor 10.0.12.2 activate
  neighbor 10.0.23.3 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.12.2 activate
  neighbor 10.0.12.2 next-hop-unchanged
  neighbor 10.0.23.3 activate
  neighbor 10.0.23.3 next-hop-unchanged
 exit-address-family
!
line vty
!
