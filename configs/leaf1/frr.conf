frr defaults datacenter
hostname leaf1
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.1/32
!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp default ipv4-unicast
 neighbor 10.0.12.3 remote-as 65000
 neighbor 10.0.12.3 timers 3 9
 !
 address-family ipv4 unicast
  network 10.0.0.1/32
  neighbor 10.0.12.3 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.12.3 activate
  advertise-all-vni
 exit-address-family
!
line vty
!
